name: Réception depuis un autre réseau
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sender:
    name: PC expéditeur Windows
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet build tests/Passload.Checks -c Release
      - run: npm ci --no-audit --no-fund
        working-directory: tests/browser
      - run: node host.mjs
        working-directory: tests/browser
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright-core install --with-deps ${{ matrix.browser }}
      - name: Télécharger et comparer les fichiers de démonstration
        env:
          PASSLOAD_BROWSER: ${{ matrix.browser }}
        run: npm run check
