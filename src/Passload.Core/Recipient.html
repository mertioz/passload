<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Passload · Téléchargement</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#18251e;font:16px/1.5 system-ui,sans-serif}
header{height:76px;background:#172720;color:white;display:flex;align-items:center;padding:0 clamp(22px,6vw,90px);gap:12px;font-size:25px;font-weight:700;letter-spacing:-1px}
.mark{display:inline-grid;place-items:center;background:#daf78a;color:#172720;border-radius:9px;width:36px;height:36px;font-size:26px;line-height:1}
main{max-width:740px;margin:clamp(36px,8vw,88px) auto;padding:0 24px}
h1{font-size:clamp(34px,6vw,57px);line-height:1.05;letter-spacing:-.055em;margin:12px 0}
.meta{color:#4a674f;text-transform:uppercase;font:700 13px ui-monospace,monospace;letter-spacing:.08em;margin:0}
i{font-style:normal;margin:0 5px}.intro,footer,small{color:#526157}.intro{margin:14px 0 26px}
a{color:inherit}.main,.pick{font-weight:650;text-decoration:none}.main{background:#daf78a;border:1px solid #b5cf70;display:inline-flex;padding:12px 19px;border-radius:8px;gap:20px;align-items:center}.main:hover{background:#cde97c}
ul{list-style:none;padding:0;border:1px solid #d9dfd5;border-radius:12px;background:white;margin-top:32px;overflow:hidden}
li{display:flex;gap:14px;align-items:center;padding:16px}li+li{border-top:1px solid #e4e8e1}li div{min-width:0;flex:1}
b{display:block;overflow-wrap:anywhere}.ext{background:#e9efdf;color:#3d583b;min-width:45px;padding:10px 5px;text-align:center;border-radius:6px;font:700 11px ui-monospace,monospace}
.pick{font-size:14px;color:#315b3d}.pick:hover{text-decoration:underline}small{font-size:13px}footer{font-size:13px;margin:20px 0}
